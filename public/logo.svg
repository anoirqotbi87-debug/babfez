<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="imperialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#061528"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBC350"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#A57A18"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#imperialBg)"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="36" y="36" width="440" height="440" rx="70" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Main Group with Shadow -->
  <g filter="url(#goldGlow)">
    <!-- Moroccan Moorish Arch (Bab) -->
    <path d="M 150 370 
             L 150 270 
             C 115 210, 205 130, 256 120 
             C 307 130, 397 210, 362 270 
             L 362 370" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Arch Highlight -->
    <path d="M 168 365 
             L 168 272 
             C 140 220, 215 150, 256 142 
             C 297 150, 372 220, 344 272 
             L 344 365" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="4" 
          stroke-opacity="0.5" 
          stroke-linecap="round"/>

    <!-- Arch Steps / Threshold -->
    <line x1="120" y1="370" x2="392" y2="370" stroke="url(#goldGradient)" stroke-width="10" stroke-linecap="round"/>
    <line x1="140" y1="384" x2="372" y2="384" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round"/>

    <!-- Concierge Golden Key -->
    <!-- Key Head Ring -->
    <circle cx="256" cy="215" r="42" fill="none" stroke="url(#goldGradient)" stroke-width="14"/>
    <!-- Inner Rosette -->
    <circle cx="256" cy="215" r="16" fill="url(#goldGradient)"/>

    <!-- Key Shaft -->
    <line x1="256" y1="257" x2="256" y2="350" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round"/>

    <!-- Collar Bands -->
    <line x1="240" y1="275" x2="272" y2="275" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round"/>
    <line x1="243" y1="285" x2="269" y2="285" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"/>

    <!-- Key Bit (Teeth) -->
    <path d="M 256 312 
             L 295 312 
             L 295 350 
             M 256 332 
             L 282 332" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
